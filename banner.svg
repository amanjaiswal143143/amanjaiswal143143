<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020308"/><stop offset="50%" stop-color="#03060d"/><stop offset="100%" stop-color="#020308"/>
  </linearGradient>
  <radialGradient id="gc" cx="50%" cy="45%" r="50%">
    <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.15"/><stop offset="55%" stop-color="#0040ff" stop-opacity="0.03"/><stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gf" cx="50%" cy="50%" r="80%">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/><stop offset="60%" stop-color="#fff" stop-opacity="0.35"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gm"><rect width="1200" height="340" fill="url(#gf)"/></mask>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#1a3a5c" stroke-width="0.6" opacity="0.5"/>
  </pattern>
  <pattern id="iso" width="60" height="34.6" patternUnits="userSpaceOnUse">
    <path d="M0 17.3L30 0L60 17.3L30 34.6Z" fill="none" stroke="#00c8ff" stroke-width="0.35" opacity="0.15"/>
  </pattern>
  <radialGradient id="if" cx="50%" cy="50%" r="65%">
    <stop offset="0%" stop-color="#fff" stop-opacity="0.45"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="im"><rect width="1200" height="340" fill="url(#if)"/></mask>
  <filter id="fxL" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="fx"  x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"  result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="fxS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="hs" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00c8ff" stop-opacity="0"/><stop offset="50%" stop-color="#00c8ff" stop-opacity="1"/><stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vs" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00c8ff" stop-opacity="0"/><stop offset="100%" stop-color="#00c8ff" stop-opacity="0.4"/>
  </linearGradient>
  <linearGradient id="lf" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#03060d" stop-opacity="1"/>
    <stop offset="20%" stop-color="#03060d" stop-opacity="0"/>
    <stop offset="80%" stop-color="#03060d" stop-opacity="0"/>
    <stop offset="100%" stop-color="#03060d" stop-opacity="1"/>
  </linearGradient>
  <clipPath id="fr"><rect width="1200" height="340"/></clipPath>
  <clipPath id="lc"><rect x="28" y="16" width="290" height="84"/></clipPath>
  <clipPath id="rc"><rect x="882" y="16" width="290" height="84"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#gc)"/>
<rect width="1200" height="340" fill="url(#grid)" mask="url(#gm)"/>
<rect width="1200" height="340" fill="url(#iso)" mask="url(#im)"/>

<!-- 3D SPHERE -->
<g transform="translate(600,168)" opacity="0.9">
  <circle cx="0" cy="0" r="115" fill="none" stroke="#00c8ff" stroke-width="0.5" opacity="0.05" filter="url(#fxL)"/>
  <!-- equatorial rings -->
  <g stroke="#00c8ff" stroke-width="0.75" fill="none" opacity="0.45" filter="url(#fxS)">
    <ellipse rx="115" ry="27"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="115" ry="27" transform="rotate(60)"><animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="26s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="115" ry="27" transform="rotate(120)"><animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="26s" repeatCount="indefinite"/></ellipse>
  </g>
  <!-- meridian rings -->
  <g stroke="#00c8ff" stroke-width="0.7" fill="none" opacity="0.4" filter="url(#fxS)">
    <ellipse rx="27" ry="115"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="19s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="27" ry="115" transform="rotate(45)"><animateTransform attributeName="transform" type="rotate" from="45" to="-315" dur="19s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="27" ry="115" transform="rotate(90)"><animateTransform attributeName="transform" type="rotate" from="90" to="-270" dur="19s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="27" ry="115" transform="rotate(135)"><animateTransform attributeName="transform" type="rotate" from="135" to="-225" dur="19s" repeatCount="indefinite"/></ellipse>
  </g>
  <!-- inner rings -->
  <g stroke="#5ff2ff" stroke-width="0.6" fill="none" opacity="0.3" filter="url(#fxS)">
    <ellipse rx="76" ry="19"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="19" ry="76"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="13s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="76" ry="19" transform="rotate(60)"><animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="13s" repeatCount="indefinite"/></ellipse>
  </g>
  <!-- outer orbit -->
  <g stroke="#0060ff" stroke-width="1.1" fill="none" opacity="0.5" filter="url(#fxS)">
    <ellipse rx="135" ry="33" transform="rotate(-18)"><animateTransform attributeName="transform" type="rotate" from="-18" to="342" dur="17s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="135" ry="33" transform="rotate(18)"><animateTransform attributeName="transform" type="rotate" from="18" to="-342" dur="17s" repeatCount="indefinite"/></ellipse>
  </g>
  <!-- orbiting nodes -->
  <defs>
    <path id="o1" d="M115,0 A115,27 0 1,1 -115,0 A115,27 0 1,1 115,0"/>
    <path id="o2" d="M0,-115 A27,115 0 1,1 0,115 A27,115 0 1,1 0,-115"/>
    <path id="o3" d="M76,0 A76,19 0 1,0 -76,0 A76,19 0 1,0 76,0"/>
  </defs>
  <g fill="#5ff2ff" filter="url(#fxS)">
    <circle r="3.2"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion><animate attributeName="opacity" values="0.3;1;0.3" dur="9s" repeatCount="indefinite"/></circle>
    <circle r="2.6"><animateMotion dur="13s" begin="2s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion></circle>
    <circle r="2"><animateMotion dur="7s" begin="1s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion></circle>
  </g>
  <!-- pulse rings -->
  <circle r="5" fill="none" stroke="#00c8ff"><animate attributeName="r" values="5;120" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="none" stroke="#00c8ff"><animate attributeName="r" values="5;120" dur="3.2s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
  <!-- core -->
  <circle cx="0" cy="0" r="4" fill="#00c8ff" filter="url(#fx)" opacity="0.9"/>
  <circle cx="0" cy="0" r="2" fill="#ffffff"/>
</g>

