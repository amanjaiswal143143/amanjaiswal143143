<svg width="1200" height="90" viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030408"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c8ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00c8ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="90" fill="url(#fbg)"/>

  <g stroke="#00c8ff" stroke-width="1" opacity="0.18">
    <line x1="0" y1="14" x2="1200" y2="14"/>
    <line x1="0" y1="76" x2="1200" y2="76"/>
  </g>

  <rect x="0" y="14" width="2" height="1.2" fill="url(#fline)">
    <animate attributeName="x" values="-20;1220" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="180" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="40" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="6" fill="#00c8ff" text-anchor="middle" filter="url(#fglow)" opacity="0.9">
    BUILD &#8226; RESEARCH &#8226; SHIP &#8226; REPEAT
  </text>
  <text x="600" y="60" font-family="JetBrains Mono, Consolas, monospace" font-size="9" letter-spacing="3" fill="#3d5468" text-anchor="middle">
    EOF // amanjaiswal143143
  </text>

  <g fill="#00c8ff" opacity="0.6">
    <circle cx="60" cy="45" r="2"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="45" r="2"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
